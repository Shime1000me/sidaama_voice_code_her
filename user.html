<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hayyo Voice — User Playground</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); color: #e2e8f0; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 800px; margin: 0 auto; }
    .nav { margin-bottom: 2rem; }
    .nav a { color: #60a5fa; text-decoration: none; font-weight: 600; }
    .nav a:hover { text-decoration: underline; }
    h1 { text-align: center; margin-bottom: 0.5rem; font-size: 2rem; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 2rem; }
    .card { background: rgba(30, 41, 59, 0.85); border: 1px solid #334155; border-radius: 16px; padding: 2rem; margin-bottom: 2rem; }
    .card h2 { color: #60a5fa; margin-bottom: 1rem; }
    textarea { width: 100%; min-height: 100px; padding: 1rem; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #e2e8f0; font-size: 1rem; margin-bottom: 1rem; resize: vertical; font-family: inherit; }
    button { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-tts { background: #2563eb; color: white; } .btn-tts:hover { background: #1d4ed8; }
    .btn-mic { background: #dc2626; color: white; } .btn-mic:hover { background: #b91c1c; }
    .btn-mic.recording { animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .status { text-align: center; padding: 0.75rem; margin: 1rem 0; border-radius: 8px; display: none; font-size: 0.9rem; }
    .status.info { display: block; background: #1e3a8a; color: #93c5fd; }
    .status.error { display: block; background: #7f1d1d; color: #fecaca; }
    .status.success { display: block; background: #14532d; color: #86efac; }
    .debug-box { background: #000; color: #10b981; padding: 1rem; border-radius: 8px; font-family: monospace; font-size: 0.8rem; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
    audio { width: 100%; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav"><a href="index.html">← Back to Home</a></div>
    <h1>🎙️ User Playground</h1>
    <p class="subtitle">Test Sidaamu Afoo AI</p>
    
    <div id="status" class="status"></div>
    <audio id="player" controls hidden></audio>

    <div class="card">
      <h2>🔊 Text to Speech</h2>
      <textarea id="tts-text" placeholder="Paste Sidaamu Afoo text here...">ani hawaasi quchumi giddo hereemmo. hawalle keerunni daggini.</textarea>
      <button class="btn-tts" id="tts-btn">Generate Voice</button>
    </div>

    <div class="card">
      <h2>🎤 Speech to Text</h2>
      <button class="btn-mic" id="mic-btn">Record Audio</button>
      <textarea id="asr-text" placeholder="Transcription will appear here..." readonly></textarea>
    </div>

    <div class="debug-box" id="debug-log">> Ready...</div>
  </div>

  <script>
    const BASE = "https://hayyoai1000me-sidaama-voice-code-her.hf.space";
    const API = BASE + "/gradio_api";
    const statusEl = document.getElementById('status');
    const debugLog = document.getElementById('debug-log');
    const player = document.getElementById('player');
    const ttsCache = new Map();
    let activeRecorder = null;

    function logDebug(msg) {
      console.log(msg);
      debugLog.textContent += `\n> ${msg}`;
      debugLog.scrollTop = debugLog.scrollHeight;
    }
    function showStatus(msg, type = 'info') {
      statusEl.className = 'status ' + type;
      statusEl.textContent = msg;
    }
    function hideStatus() { statusEl.className = 'status'; statusEl.textContent = ''; }

    async function request(step, url, options = {}) {
      let res = await fetch(url, options);
      if (!res.ok) throw new Error(`${step}: HTTP ${res.status}`);
      return res;
    }
    function parseResult(stream) {
      let event = '';
      for (const line of stream.split(/\r?\n/)) {
        if (line.startsWith('event:')) event = line.slice(6).trim();
        else if (line.startsWith('data:')) {
          const data = line.slice(5).trim();
          if (event === 'complete') return JSON.parse(data);
          if (event === 'error') throw new Error('Server error');
        }
      }
      throw new Error('Connection closed');
    }
    async function callApi(name, data) {
      const start = await request('Start', `${API}/call/${name}`, { 
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data }) 
      });
      const { event_id } = await start.json();
      logDebug(`Job queued (${name}). Waiting...`);
      const result = await request('Result', `${API}/call/${name}/${event_id}`);
      return parseResult(await result.text());
    }
    async function uploadFile(file) {
      const form = new FormData(); form.append('files', file);
      const res = await request('Upload', `${API}/upload`, { method: 'POST', body: form });
      const [path] = await res.json(); return { path, orig_name: file.name, meta: { _type: 'gradio.FileData' } };
    }
    function hexToBlob(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < hex.length; i += 2) bytes[i / 2] = parseInt(hex.substring(i, i + 2), 16);
      return new Blob([bytes], { type: 'audio/wav' });
    }
    async function textToSpeech(text) {
      if (!ttsCache.has(text)) {
        const [hex] = await callApi('speak', [text]);
        if (typeof hex !== 'string' || !/^52494646[0-9a-f]+$/i.test(hex)) throw new Error('No audio returned');
        ttsCache.set(text, URL.createObjectURL(hexToBlob(hex)));
      }
      return ttsCache.get(text);
    }
    async function speechToText(file) {
      const fileData = await uploadFile(file);
      const [text] = await callApi('transcribe', [fileData]);
      if (typeof text === 'string' && text.startsWith('Error:')) throw new Error(text);
      return text;
    }

    document.getElementById('tts-btn').addEventListener('click', async () => {
      const text = document.getElementById('tts-text').value;
      const btn = document.getElementById('tts-btn');
      btn.disabled = true; showStatus('⏳ Generating...');
      try {
        player.src = await textToSpeech(text); player.hidden = false; await player.play(); hideStatus();
      } catch (e) { logDebug(`TTS Error: ${e.message}`); showStatus('❌ Failed', 'error'); } finally { btn.disabled = false; }
    });

    document.getElementById('mic-btn').addEventListener('click', async () => {
      const btn = document.getElementById('mic-btn'); const input = document.getElementById('asr-text');
      if (activeRecorder && activeRecorder.state === 'recording') { activeRecorder.stop(); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const recorder = new MediaRecorder(stream); const chunks = []; activeRecorder = recorder;
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = async () => {
          btn.classList.remove('recording'); stream.getTracks().forEach(t => t.stop()); btn.disabled = true; showStatus('⏳ Transcribing...');
          const file = new File(chunks, 'recording.webm', { type: 'audio/webm' });
          try {
            const text = await speechToText(file); input.value = text || "No speech detected."; showStatus('✅ Transcribed', 'success'); setTimeout(hideStatus, 1500);
          } catch (e) { logDebug(`ASR Error: ${e.message}`); showStatus('❌ Failed', 'error'); } finally { btn.disabled = false; }
        };
        recorder.start(); btn.classList.add('recording'); showStatus('🔴 Recording... tap again to stop', 'info');
      } catch (e) { logDebug(`Mic Error: ${e.message}`); showStatus('❌ Mic denied', 'error'); }
    });

    logDebug('Page ready.');
    fetch(BASE, { mode: 'no-cors' }).then(() => logDebug('Pre-wake ping sent.')).catch(() => {});
  </script>
</body>
</html>
