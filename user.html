<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Playground</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; padding: 2rem; }
    .container { max-width: 800px; margin: 0 auto; }
    .back { color: #60a5fa; text-decoration: none; display: inline-block; margin-bottom: 2rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; border: 1px solid #334155; }
    h2 { color: #60a5fa; margin-bottom: 1rem; }
    textarea { width: 100%; height: 100px; padding: 1rem; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 8px; margin-bottom: 1rem; resize: none; }
    .btn { background: #2563eb; color: white; padding: 0.75rem 1rem; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
    .btn-mic { background: #dc2626; }
    .status { text-align: center; padding: 0.5rem; border-radius: 8px; margin-bottom: 1rem; display: none; }
    .status.info { display: block; background: #1e3a8a; }
    .status.success { display: block; background: #14532d; }
    .status.error { display: block; background: #7f1d1d; }
    audio { width: 100%; margin-top: 1rem; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← Back to Home</a>
    <h1>🎙️ User Playground</h1>
    <div id="status" class="status"></div>
    <audio id="player" controls hidden></audio>
    
    <div class="grid">
      <div class="card">
        <h2>🔊 Text to Speech</h2>
        <textarea id="tts-input">Barsiissi hundaaf barbaachisaadha.</textarea>
        <button class="btn" id="tts-btn">Generate Voice</button>
      </div>
      <div class="card">
        <h2>🎤 Speech to Text</h2>
        <button class="btn btn-mic" id="mic-btn">Record Audio</button>
        <textarea id="asr-output" placeholder="Transcription appears here..." readonly></textarea>
      </div>
    </div>
  </div>

  <script>
    const BASE = "https://hayyoai1000me-sidaama-voice-code-her.hf.space";
    const API = BASE + "/gradio_api";
    const player = document.getElementById('player');
    const statusEl = document.getElementById('status');
    let activeRecorder = null;

    function showStatus(msg, type) { statusEl.className = 'status ' + type; statusEl.textContent = msg; }

    async function request(step, url, options = {}) { let res = await fetch(url, options); if (!res.ok) throw new Error(`${step} Error`); return res; }
    function parseResult(s) { let ev=''; for(const l of s.split(/\r?\n/)){ if(l.startsWith('event:')) ev=l.slice(6).trim(); else if(l.startsWith('data:')){ if(ev==='complete') return JSON.parse(l.slice(5).trim()); } } throw new Error('Failed'); }
    async function callApi(name, data) { const st = await request('Start', `${API}/call/${name}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({data}) }); const {event_id} = await st.json(); const rs = await request('Result', `${API}/call/${name}/${event_id}`); return parseResult(await rs.text()); }
    async function uploadFile(file) { const f = new FormData(); f.append('files', file); const res = await request('Upload', `${API}/upload`, { method: 'POST', body: f }); const [path] = await res.json(); return { path, orig_name: file.name, meta: { _type: 'gradio.FileData' } }; }
    function hexToBlob(hex) { const bytes = new Uint8Array(hex.length / 2); for (let i = 0; i < hex.length; i += 2) bytes[i / 2] = parseInt(hex.substring(i, i + 2), 16); return new Blob([bytes], { type: 'audio/wav' }); }
    
    async function textToSpeech(text) { const [hex] = await callApi('speak', [text]); return URL.createObjectURL(hexToBlob(hex)); }
    async function speechToText(file) { const fd = await uploadFile(file); const [txt] = await callApi('transcribe', [fd]); return txt; }

    document.getElementById('tts-btn').onclick = async () => {
      const text = document.getElementById('tts-input').value;
      document.getElementById('tts-btn').textContent = "Generating...";
      showStatus('⏳ Loading...', 'info');
      try { player.src = await textToSpeech(text); player.hidden=false; player.play(); statusEl.className='status'; } catch (e) { showStatus('❌ Error', 'error'); }
      document.getElementById('tts-btn').textContent = "Generate Voice";
    };

    document.getElementById('mic-btn').onclick = async () => {
      const btn = document.getElementById('mic-btn');
      if (activeRecorder && activeRecorder.state === 'recording') { activeRecorder.stop(); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const recorder = new MediaRecorder(stream); const chunks = []; activeRecorder = recorder;
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = async () => {
          btn.style.background = ''; stream.getTracks().forEach(t => t.stop()); showStatus('⏳ Transcribing...', 'info');
          const file = new File(chunks, `rec.webm`, { type: 'audio/webm' });
          try { document.getElementById('asr-output').value = await speechToText(file); showStatus('✅ Done', 'success'); setTimeout(()=>statusEl.className='status', 1500); } catch (e) { showStatus('❌ Error', 'error'); }
        };
        recorder.start(); btn.style.background = '#991b1b'; showStatus('🔴 Recording...', 'info');
      } catch (e) { showStatus('❌ Mic Denied', 'error'); }
    };
  </script>
</body>
</html>
