<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Institution Directory</title>
  <style>
    body { font-family: sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); color: white; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 800px; margin: 0 auto; }
    .back { color: #60a5fa; text-decoration: none; display: inline-block; margin-bottom: 1rem; }
    h1 { text-align: center; margin-bottom: 0.5rem; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 2rem; }
    
    .directory-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .org-card { background: #1e293b; padding: 1.5rem; border-radius: 12px; border: 1px solid #334155; cursor: pointer; transition: 0.2s; text-align: center; }
    .org-card:hover { border-color: #60a5fa; transform: translateY(-2px); }
    .org-card h3 { color: #60a5fa; margin-bottom: 0.5rem; }
    .org-card p { color: #94a3b8; font-size: 0.9rem; }

    .form-card { background: rgba(30, 41, 59, 0.85); padding: 2rem; border-radius: 16px; border: 1px solid #334155; display: none; }
    .field { margin-bottom: 1.5rem; }
    .label { font-weight: bold; margin-bottom: 0.5rem; display: flex; justify-content: space-between; }
    input { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 8px; }
    .icon-btn { background: #1e293b; border: 1px solid #475569; color: white; padding: 0.5rem; border-radius: 8px; cursor: pointer; }
    .status { text-align: center; padding: 1rem; margin: 1rem 0; border-radius: 8px; display: none; }
    .status.info { display: block; background: #1e3a8a; }
    .status.success { display: block; background: #14532d; }
    audio { width: 100%; margin-bottom: 1rem; }
    .submit-btn { width: 100%; padding: 1rem; background: #059669; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
    .back-btn { display: inline-block; margin-bottom: 1rem; color: #60a5fa; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← Back to Home</a>

    <div id="directory-view">
      <h1>Institution Directory</h1>
      <p class="subtitle">Select an organization to open their voice form.</p>
      <div class="directory-grid" id="org-list"></div>
    </div>

    <div id="form-view" style="display: none;">
      <a class="back-btn" onclick="backToDirectory()">← Back to Directory</a>
      <h1 id="org-title"></h1>
      <p class="subtitle">Voice Application</p>
      
      <div id="status" class="status"></div>
      <audio id="player" controls hidden></audio>

      <div class="form-card" style="display: block;" id="dynamic-form-container">
        <!-- Dynamic questions will be injected here -->
        <button class="submit-btn" onclick="alert('Application Submitted!')">Submit Application</button>
      </div>
    </div>
  </div>

  <script>
    const BASE = "https://hayyoai1000me-sidaama-voice-code-her.hf.space";
    const API = BASE + "/gradio_api";
    const player = document.getElementById('player');
    const statusEl = document.getElementById('status');
    const ttsCache = new Map();
    let activeRecorder = null;

    function showStatus(msg, type) { statusEl.className = 'status ' + type; statusEl.textContent = msg; }
    async function request(step, url, options = {}) { let res = await fetch(url, options); if (!res.ok) throw new Error(`${step} Error`); return res; }
    function parseResult(s) { let ev=''; for(const l of s.split(/\r?\n/)){ if(l.startsWith('event:')) ev=l.slice(6).trim(); else if(l.startsWith('data:')){ if(ev==='complete') return JSON.parse(l.slice(5).trim()); } } throw new Error('Failed'); }
    async function callApi(name, data) { const st = await request('Start', `${API}/call/${name}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({data}) }); const {event_id} = await st.json(); const rs = await request('Result', `${API}/call/${name}/${event_id}`); return parseResult(await rs.text()); }
    async function uploadFile(file) { const f = new FormData(); f.append('files', file); const res = await request('Upload', `${API}/upload`, { method: 'POST', body: f }); const [path] = await res.json(); return { path, orig_name: file.name, meta: { _type: 'gradio.FileData' } }; }
    function hexToBlob(hex) { const bytes = new Uint8Array(hex.length / 2); for (let i = 0; i < hex.length; i += 2) bytes[i / 2] = parseInt(hex.substring(i, i + 2), 16); return new Blob([bytes], { type: 'audio/wav' }); }
    async function textToSpeech(text) { if (!ttsCache.has(text)) { const [hex] = await callApi('speak', [text]); ttsCache.set(text, URL.createObjectURL(hexToBlob(hex))); } return ttsCache.get(text); }
    async function speechToText(file) { const fd = await uploadFile(file); const [txt] = await callApi('transcribe', [fd]); return txt; }

    function loadDirectory() {
      let orgs = JSON.parse(localStorage.getItem('hayyo_orgs')) || [];
      const list = document.getElementById('org-list');
      list.innerHTML = "";
      let count = 0;
      
      orgs.forEach(org => {
        if (org.questions && org.questions.length > 0) {
          count++;
          const card = document.createElement('div');
          card.className = 'org-card';
          card.innerHTML = `<h3>${org.name}</h3><p>Click to open form</p>`;
          card.onclick = () => openForm(org);
          list.appendChild(card);
        }
      });

      if (count === 0) {
        list.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #94a3b8;'>No institutions registered yet.</p>";
      }
    }

    function openForm(org) {
      document.getElementById('directory-view').style.display = 'none';
      document.getElementById('form-view').style.display = 'block';
      document.getElementById('org-title').textContent = org.name;
      
      const container = document.getElementById('dynamic-form-container');
      container.innerHTML = ""; // Clear old fields

      // Build the form dynamically based on the questions array
      org.questions.forEach((questionText, index) => {
        const fieldDiv = document.createElement('div');
        fieldDiv.className = 'field';
        fieldDiv.innerHTML = `
          <div class="label">
            <span>${questionText}</span>
            <span>
              <button class="icon-btn play-btn">🔊</button>
              <button class="icon-btn mic-btn" id="mic-${index}">🎤</button>
            </span>
          </div>
          <input type="text" id="ans-${index}" />
        `;
        container.appendChild(fieldDiv);
        
        // Wire up the play and mic buttons for this specific field
        const playBtn = fieldDiv.querySelector('.play-btn');
        const micBtn = fieldDiv.querySelector('.mic-btn');
        const input = fieldDiv.querySelector('input');
        
        playBtn.onclick = async () => { 
          showStatus('⏳ Loading Audio...','info'); 
          player.src = await textToSpeech(questionText); 
          player.hidden=false; player.play(); statusEl.className='status'; 
        };
        
        micBtn.onclick = () => handleMic(micBtn, input);
      });

      // Add submit button back at the bottom
      const submitBtn = document.createElement('button');
      submitBtn.className = 'submit-btn';
      submitBtn.textContent = 'Submit Application';
      submitBtn.onclick = () => alert('Application Submitted!');
      container.appendChild(submitBtn);
    }

    function backToDirectory() {
      document.getElementById('directory-view').style.display = 'block';
      document.getElementById('form-view').style.display = 'none';
    }

    async function handleMic(btn, input) {
      if (activeRecorder && activeRecorder.state === 'recording') { activeRecorder.stop(); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const recorder = new MediaRecorder(stream); const chunks = []; activeRecorder = recorder;
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = async () => {
          btn.style.background = ''; stream.getTracks().forEach(t => t.stop()); showStatus('⏳ Transcribing...','info');
          const file = new File(chunks, `rec.webm`, { type: 'audio/webm' });
          try { input.value = await speechToText(file); showStatus('✅ Transcribed', 'success'); setTimeout(()=>statusEl.className='status',1500); } catch(e) { showStatus('❌ Error', 'error'); }
        };
        recorder.start(); btn.style.background = '#dc2626'; showStatus('🔴 Recording...', 'info');
      } catch (e) { showStatus('❌ Mic Denied', 'error'); }
    }

    loadDirectory();
  </script>
</body>
</html>
