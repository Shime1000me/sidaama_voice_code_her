<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Institution Directory — Transcribe'Her</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow: #FACC15;
      --yellow-dark: #EAB308;
      --black: #0A0A0A;
      --gray-500: #6B7280;
      --gray-100: #F3F4F6;
      --white: #FFFFFF;
      --red: #dc2626;
      --green: #059669;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--gray-100); color: var(--black); min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Top Nav */
    .navbar { border-bottom: 1px solid #E5E7EB; padding: 1rem 2rem; background: white; display: flex; justify-content: flex-start; align-items: center; position: sticky; top: 0; z-index: 50; }
    .logo { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--black); }
    .logo span { color: var(--yellow-dark); }
    
    /* Main Layout */
    .main-content { flex: 1; padding: 3rem 1rem; display: flex; justify-content: center; }
    .container { max-width: 800px; width: 100%; }
    .back { color: var(--gray-500); text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; font-weight: 600; font-size: 0.9rem; transition: color 0.2s; }
    .back:hover { color: var(--black); }
    
    /* Typography */
    h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
    .subtitle { color: var(--gray-500); margin-bottom: 2rem; font-size: 1rem; }
    
    /* Directory Grid */
    .directory-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .org-card { background: white; padding: 1.5rem; border-radius: 12px; border: 2px solid var(--black); box-shadow: 4px 4px 0px 0px rgba(0,0,0,0.1); cursor: pointer; transition: all 0.2s; text-align: left; }
    .org-card:hover { transform: translateY(-4px); box-shadow: 4px 8px 0px 0px rgba(0,0,0,0.2); border-color: var(--yellow-dark); }
    .org-card h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 0.5rem; }
    .org-card p { color: var(--gray-500); font-size: 0.9rem; }

    /* Form View */
    .form-card { background: white; padding: 2.5rem; border-radius: 16px; border: 2px solid var(--black); box-shadow: 6px 6px 0px 0px var(--black); display: none; }
    .field { margin-bottom: 1.5rem; }
    .label { font-weight: 700; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; }
    input { width: 100%; padding: 0.75rem 1rem; background: white; border: 2px solid #E5E7EB; color: var(--black); border-radius: 8px; font-family: inherit; font-size: 1rem; transition: border-color 0.2s; }
    input:focus { outline: none; border-color: var(--yellow-dark); }
    
    /* Icon Buttons */
    .btn-group { display: flex; gap: 0.5rem; }
    .icon-btn { background: var(--gray-100); border: 2px solid #E5E7EB; color: var(--black); padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-size: 1.1rem; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
    .icon-btn:hover { border-color: var(--black); background: white; }
    
    /* Status Box */
    .status { text-align: center; padding: 1rem; margin: 1rem 0; border-radius: 8px; display: none; font-weight: 700; }
    .status.info { display: block; background: #DBEAFE; color: #1E40AF; border: 2px solid #93C5FD; }
    .status.success { display: block; background: #D1FAE5; color: var(--green); border: 2px solid var(--green); }
    .status.error { display: block; background: #FEE2E2; color: var(--red); border: 2px solid var(--red); }
    
    audio { width: 100%; margin-bottom: 1rem; }
    
    /* Submit Button */
    .submit-btn { width: 100%; padding: 1rem; background: var(--yellow); color: var(--black); border: 2px solid var(--black); border-radius: 8px; font-weight: 800; cursor: pointer; box-shadow: 4px 4px 0px 0px var(--black); transition: all 0.2s; font-size: 1rem; margin-top: 1rem; }
    .submit-btn:hover { transform: translate(1px, 1px); box-shadow: 3px 3px 0px 0px var(--black); }
    
    @media (max-width: 600px) {
      .directory-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Top Nav -->
  <header class="navbar">
    <a href="index.html" class="logo">
      Transcribe<span>'</span>Her
    </a>
  </header>

  <!-- Main Content -->
  <div class="main-content">
    <div class="container">
      <a href="index.html" class="back">← Back to Home</a>

      <!-- Directory View -->
      <div id="directory-view">
        <h1>Institution Directory</h1>
        <p class="subtitle">Select an organization to open their voice form.</p>
        <div class="directory-grid" id="org-list"></div>
      </div>

      <!-- Form View -->
      <div id="form-view" style="display: none;">
        <a class="back" onclick="backToDirectory()" style="cursor: pointer;">← Back to Directory</a>
        <h1 id="org-title"></h1>
        <p class="subtitle">Voice Application</p>
        
        <div id="status" class="status"></div>
        <audio id="player" controls hidden></audio>

        <div class="form-card" style="display: block;" id="dynamic-form-container">
          <!-- Dynamic questions will be injected here -->
        </div>
      </div>
    </div>
  </div>

  <script>
    const BASE = "https://hayyoai1000me-sidaama-voice-code-her.hf.space";
    const API = BASE + "/gradio_api";
    const player = document.getElementById('player');
    const statusEl = document.getElementById('status');
    const ttsCache = new Map();
    let activeRecorder = null;

    function showStatus(msg, type) { statusEl.className = 'status ' + type; statusEl.textContent = msg; }
    async function request(step, url, options = {}) { let res = await fetch(url, options); if (!res.ok) throw new Error(`${step} Error`); return res; }
    function parseResult(s) { let ev=''; for(const l of s.split(/\r?\n/)){ if(l.startsWith('event:')) ev=l.slice(6).trim(); else if(l.startsWith('data:')){ if(ev==='complete') return JSON.parse(l.slice(5).trim()); } } throw new Error('Failed'); }
    async function callApi(name, data) { const st = await request('Start', `${API}/call/${name}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({data}) }); const {event_id} = await st.json(); const rs = await request('Result', `${API}/call/${name}/${event_id}`); return parseResult(await rs.text()); }
    async function uploadFile(file) { const f = new FormData(); f.append('files', file); const res = await request('Upload', `${API}/upload`, { method: 'POST', body: f }); const [path] = await res.json(); return { path, orig_name: file.name, meta: { _type: 'gradio.FileData' } }; }
    function hexToBlob(hex) { const bytes = new Uint8Array(hex.length / 2); for (let i = 0; i < hex.length; i += 2) bytes[i / 2] = parseInt(hex.substring(i, i + 2), 16); return new Blob([bytes], { type: 'audio/wav' }); }
    async function textToSpeech(text) { if (!ttsCache.has(text)) { const [hex] = await callApi('speak', [text]); ttsCache.set(text, URL.createObjectURL(hexToBlob(hex))); } return ttsCache.get(text); }
    async function speechToText(file) { const fd = await uploadFile(file); const [txt] = await callApi('transcribe', [fd]); return txt; }

    function loadDirectory() {
      let orgs = JSON.parse(localStorage.getItem('hayyo_orgs')) || [];
      const list = document.getElementById('org-list');
      list.innerHTML = "";
      let count = 0;
      
      orgs.forEach(org => {
        if (org.questions && org.questions.length > 0) {
          count++;
          const card = document.createElement('div');
          card.className = 'org-card';
          card.innerHTML = `<h3>${org.name}</h3><p>Click to open form</p>`;
          card.onclick = () => openForm(org);
          list.appendChild(card);
        }
      });

      if (count === 0) {
        list.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #6B7280; padding: 2rem;'>No institutions registered yet. Go to the Form Builder to create one.</p>";
      }
    }

    function openForm(org) {
      document.getElementById('directory-view').style.display = 'none';
      document.getElementById('form-view').style.display = 'block';
      document.getElementById('org-title').textContent = org.name;
      
      const container = document.getElementById('dynamic-form-container');
      container.innerHTML = ""; 

      org.questions.forEach((questionText, index) => {
        const fieldDiv = document.createElement('div');
        fieldDiv.className = 'field';
        fieldDiv.innerHTML = `
          <div class="label">
            <span>${questionText}</span>
            <span class="btn-group">
              <button class="icon-btn play-btn">🔊</button>
              <button class="icon-btn mic-btn" id="mic-${index}">🎤</button>
            </span>
          </div>
          <input type="text" id="ans-${index}" />
        `;
        container.appendChild(fieldDiv);
        
        const playBtn = fieldDiv.querySelector('.play-btn');
        const micBtn = fieldDiv.querySelector('.mic-btn');
        const input = fieldDiv.querySelector('input');
        
        playBtn.onclick = async () => { 
          showStatus('⏳ Loading Audio...','info'); 
          player.src = await textToSpeech(questionText); 
          player.hidden=false; player.play(); statusEl.className='status'; 
        };
        
        micBtn.onclick = () => handleMic(micBtn, input);
      });

      const submitBtn = document.createElement('button');
      submitBtn.className = 'submit-btn';
      submitBtn.textContent = 'Submit Application';
      submitBtn.onclick = () => alert('Application Submitted!');
      container.appendChild(submitBtn);
    }

    function backToDirectory() {
      document.getElementById('directory-view').style.display = 'block';
      document.getElementById('form-view').style.display = 'none';
    }

    async function handleMic(btn, input) {
      if (activeRecorder && activeRecorder.state === 'recording') { activeRecorder.stop(); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const recorder = new MediaRecorder(stream); const chunks = []; activeRecorder = recorder;
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = async () => {
          btn.style.background = ''; stream.getTracks().forEach(t => t.stop()); showStatus('⏳ Transcribing...','info');
          const file = new File(chunks, `rec.webm`, { type: 'audio/webm' });
          try { input.value = await speechToText(file); showStatus('✅ Transcribed', 'success'); setTimeout(()=>statusEl.className='status',1500); } catch(e) { showStatus('❌ Error', 'error'); }
        };
        recorder.start(); btn.style.background = '#dc2626'; showStatus('🔴 Recording...', 'info');
      } catch (e) { showStatus('❌ Mic Denied', 'error'); }
    }

    loadDirectory();
  </script>
</body>
</html>
