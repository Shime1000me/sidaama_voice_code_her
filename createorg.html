<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Builder — Transcribe'Her</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow: #FACC15;
      --yellow-dark: #EAB308;
      --black: #0A0A0A;
      --gray-500: #6B7280;
      --gray-100: #F3F4F6;
      --white: #FFFFFF;
      --red: #dc2626;
      --green: #059669;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--gray-100); color: var(--black); min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Top Nav */
    .navbar { border-bottom: 1px solid #E5E7EB; padding: 1rem 2rem; background: white; display: flex; justify-content: flex-start; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--black); }
    .logo span { color: var(--yellow-dark); }
    
    /* Main Layout */
    .main-content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; }
    .card { background: white; padding: 3rem; border-radius: 16px; border: 2px solid var(--black); box-shadow: 6px 6px 0px 0px var(--black); width: 100%; max-width: 600px; }
    
    /* Typography */
    h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; }
    p.subtitle { color: var(--gray-500); margin-bottom: 2rem; font-size: 0.95rem; }
    .back { color: var(--gray-500); text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; font-weight: 600; font-size: 0.9rem; transition: color 0.2s; }
    .back:hover { color: var(--black); }
    
    /* Form Elements */
    label { display: block; margin-bottom: 0.5rem; margin-top: 1.5rem; color: var(--black); font-size: 0.9rem; font-weight: 700; }
    input { width: 100%; padding: 0.75rem 1rem; background: white; border: 2px solid #E5E7EB; color: var(--black); border-radius: 8px; font-family: inherit; font-size: 1rem; transition: border-color 0.2s; }
    input:focus { outline: none; border-color: var(--yellow-dark); }
    
    /* Dynamic Fields */
    .dynamic-field { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .dynamic-field input { margin-top: 0; }
    .remove-btn { background: var(--red); color: white; border: none; border-radius: 8px; padding: 0 1rem; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    .remove-btn:hover { background: #b91c1c; }
    
    /* Buttons */
    .add-btn { background: var(--white); color: var(--black); padding: 0.75rem 1rem; border: 2px dashed #D1D5DB; border-radius: 8px; cursor: pointer; font-weight: 700; margin-top: 1rem; width: 100%; transition: all 0.2s; }
    .add-btn:hover { border-color: var(--black); background: var(--gray-100); }
    
    .btn { background: var(--yellow); color: var(--black); padding: 1rem; border: 2px solid var(--black); border-radius: 8px; cursor: pointer; font-weight: 800; width: 100%; margin-top: 2rem; box-shadow: 4px 4px 0px 0px var(--black); transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 0.5rem; }
    .btn:hover { transform: translate(1px, 1px); box-shadow: 3px 3px 0px 0px var(--black); }
    
    /* Success Message */
    .success { display: none; margin-top: 1.5rem; background: #D1FAE5; color: var(--green); border: 2px solid var(--green); padding: 1rem; border-radius: 8px; text-align: center; font-weight: 700; }
    .success a { color: var(--black); text-decoration: underline; }
  </style>
</head>
<body>

  <!-- Top Nav -->
  <header class="navbar">
    <a href="index.html" class="logo">
      Transcribe<span>'</span>Her
    </a>
  </header>

  <!-- Main Content -->
  <div class="main-content">
    <div style="width: 100%; max-width: 600px;">
      <a href="index.html" class="back">← Back to Home</a>
      
      <div class="card">
        <h2>Form Builder</h2>
        <p class="subtitle">Create custom Sidaamu Afoo voice forms for your organization.</p>
        
        <label>API Key</label>
        <input type="text" id="api_key" placeholder="Paste your sk_live_... key">
        
        <div id="questions-container">
          <label>Question 1</label>
          <div class="dynamic-field">
            <input type="text" class="question-input" value="Su'makki borreessi?">
          </div>
        </div>

        <button class="add-btn" onclick="addQuestion()">+ Add Another Question</button>
        <button class="btn" onclick="saveForm()">
          <span>✨</span> Generate Live Form
        </button>
        
        <div class="success" id="success-msg">
          ✅ Form Created Successfully! <br><br>
          <a href="institution.html">Open Institution Directory →</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function addQuestion() {
      const container = document.getElementById('questions-container');
      const count = container.querySelectorAll('.dynamic-field').length + 1;
      
      const div = document.createElement('div');
      div.innerHTML = `
        <label>Question ${count}</label>
        <div class="dynamic-field">
          <input type="text" class="question-input" placeholder="Enter Sidaamu Afoo question">
          <button class="remove-btn" onclick="this.parentElement.parentElement.remove()">X</button>
        </div>
      `;
      container.appendChild(div);
    }

    function saveForm() {
      const key = document.getElementById('api_key').value;
      const inputs = document.querySelectorAll('.question-input');
      const questions = [];

      inputs.forEach(input => {
        if (input.value.trim()) questions.push(input.value.trim());
      });

      if(!key) return alert("Please enter your API Key");
      if(questions.length === 0) return alert("Please add at least one question");

      let orgs = JSON.parse(localStorage.getItem('hayyo_orgs')) || [];
      const orgIndex = orgs.findIndex(o => o.key === key);
      
      if (orgIndex === -1) {
        return alert("Invalid API Key. Please check and try again.");
      }

      // Save the array of questions
      orgs[orgIndex].questions = questions;
      localStorage.setItem('hayyo_orgs', JSON.stringify(orgs));

      document.getElementById('success-msg').style.display = 'block';
    }
  </script>
</body>
</html>
