<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Portal — Transcribe'Her</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow: #FACC15;
      --black: #0A0A0A;
      --gray-500: #6B7280;
      --gray-100: #F3F4F6;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--gray-100); color: var(--black); min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Top Nav */
    .navbar { border-bottom: 1px solid #E5E7EB; padding: 1rem 2rem; background: white; display: flex; justify-content: flex-start; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--black); }
    .logo span { color: var(--yellow-dark); }
    
    /* Main Layout */
    .main-content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; }
    .card { background: white; padding: 3rem; border-radius: 16px; border: 2px solid var(--black); box-shadow: 6px 6px 0px 0px var(--black); width: 100%; max-width: 500px; }
    
    /* Typography */
    h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; }
    p.subtitle { color: var(--gray-500); margin-bottom: 2rem; font-size: 0.95rem; }
    .back { color: var(--gray-500); text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; font-weight: 600; font-size: 0.9rem; transition: color 0.2s; }
    .back:hover { color: var(--black); }
    
    /* Form Elements */
    label { display: block; margin-bottom: 0.5rem; color: var(--black); font-size: 0.9rem; font-weight: 700; }
    input { width: 100%; padding: 0.75rem 1rem; background: white; border: 2px solid #E5E7EB; color: var(--black); border-radius: 8px; font-family: inherit; font-size: 1rem; transition: border-color 0.2s; }
    input:focus { outline: none; border-color: var(--yellow-dark); }
    input:disabled { background: var(--gray-100); color: var(--gray-500); cursor: not-allowed; }
    
    /* Button */
    .btn { background: var(--yellow); color: var(--black); padding: 1rem; border: 2px solid var(--black); border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 1rem; width: 100%; margin-top: 1.5rem; box-shadow: 4px 4px 0px 0px var(--black); transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 0.5rem; }
    .btn:hover { transform: translate(1px, 1px); box-shadow: 3px 3px 0px 0px var(--black); }
    
    /* Key Result Box */
    .key-box { display: none; background: var(--gray-100); padding: 1rem; border: 2px dashed #D1D5DB; border-radius: 8px; font-family: monospace; margin-top: 1.5rem; justify-content: space-between; align-items: center; }
    .key-text { font-weight: 600; font-size: 0.95rem; color: var(--black); overflow: hidden; text-overflow: ellipsis; }
    .copy-btn { background: var(--black); color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 0.8rem; transition: background 0.2s; }
    .copy-btn:hover { background: var(--gray-500); }
    
    /* Next Step */
    .next-btn { display: none; margin-top: 2rem; text-align: center; border-top: 1px solid #E5E7EB; padding-top: 1.5rem; }
    .next-btn a { color: var(--black); text-decoration: none; font-weight: 800; display: inline-flex; align-items: center; gap: 0.5rem; transition: gap 0.2s; }
    .next-btn a:hover { gap: 0.8rem; color: var(--yellow-dark); }
  </style>
</head>
<body>

  <!-- Top Nav -->
  <header class="navbar">
    <a href="index.html" class="logo">
      Transcribe<span>'</span>Her
    </a>
  </header>

  <!-- Main Content -->
  <div class="main-content">
    <div style="width: 100%; max-width: 500px;">
      <a href="index.html" class="back">← Back to Home</a>
      
      <div class="card">
        <h2>Enterprise Portal</h2>
        <p class="subtitle">Register your organization to generate a secure API key.</p>
        
        <div style="margin-bottom: 1rem;">
          <label>Organization Name</label>
          <input type="text" id="org_name" placeholder="e.g., Hawassa Microfinance">
        </div>
        
        <button class="btn" id="gen-btn" onclick="registerOrg()">
          <span>🔑</span> Generate API Key ($49/mo)
        </button>
        
        <div class="key-box" id="key-box">
          <span class="key-text" id="key-text"></span>
          <button class="copy-btn" onclick="copyKey()">Copy</button>
        </div>
        
        <div class="next-btn" id="next-btn">
          <a href="createorg.html">Proceed to Form Builder →</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function registerOrg() {
      const name = document.getElementById('org_name').value;
      if (!name) return alert("Please enter an organization name.");

      document.getElementById('gen-btn').textContent = "Generating...";
      
      setTimeout(() => {
        const newKey = "sk_live_" + Math.random().toString(36).substring(2, 10);
        
        let orgs = JSON.parse(localStorage.getItem('hayyo_orgs')) || [];
        orgs.push({ key: newKey, name: name, q1: null, q2: null });
        localStorage.setItem('hayyo_orgs', JSON.stringify(orgs));
        
        document.getElementById('org_name').disabled = true;
        document.getElementById('gen-btn').style.display = 'none';
        document.getElementById('key-text').textContent = newKey;
        document.getElementById('key-box').style.display = 'flex';
        document.getElementById('next-btn').style.display = 'block';
      }, 500);
    }

    function copyKey() {
      navigator.clipboard.writeText(document.getElementById('key-text').textContent);
      alert("API Key Copied!");
    }
  </script>
</body>
</html>
